events {
    worker_connections 1024;
}
http {
    client_max_body_size 50m;
    server {
        listen 80;
        location / {
            proxy_pass http://192.168.0.6:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
        }
    }
}