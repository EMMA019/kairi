name: Bug report
description: Something broken that is not specifically a hallucination
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For invented facts / missing citations, use the **Hallucination** template instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python/Node versions, Docker or local
