name: Weekly Ticker Refresh

on:
  schedule:
    # 毎週日曜 午前3時（UTC）= 日本時間 正午
    - cron: '0 3 * * 0'
  
  # 手動実行も可能
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          cd personal
          pip install -r backend/requirements.txt
          pip install -r ../shared/requirements-shared.txt
      
      - name: Run Ticker Refresh
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          cd personal
          python scripts/refresh_tickers.py
      
      - name: Commit Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add shared/engines/config.py
          git add logs/*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 Weekly ticker refresh: $(date +%Y-%m-%d)"
      
      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
      
      - name: Notify (Optional)
        if: success()
        run: |
          echo "✅ Ticker refresh completed successfully"
          # ここにSlack通知などを追加可能
