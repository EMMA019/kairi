services:
  - type: web
    name: kairi-chat-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: KAIRI_ENABLE_SCHEDULERS
        value: "0"
      # Live chat: set LLM/search keys in the Render dashboard.
      # Do NOT set KAIRI_DEMO=1 on this service (that is local/screenshot-only).
