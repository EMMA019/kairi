services:
  - type: web
    name: kairi-chat-backend
    runtime: python
    plan: free
    # Existing Render service: API backend for Cloudflare Pages / mobile.
    # SPA stays on Pages (VITE_API_BASE_URL → this host).
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: KAIRI_ENABLE_SCHEDULERS
        value: "0"
      # Live chat: set LLM/search keys in the Render dashboard.
      # Do NOT set KAIRI_DEMO=1 on this service.
